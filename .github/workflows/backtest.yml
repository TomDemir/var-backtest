name: backtest

on:
  workflow_dispatch:
  push:
    paths: ["src/**", "scripts/**", "tests/**", "requirements.txt", ".github/workflows/**"]

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt && pip install --no-deps -e .
      - run: python -m unittest discover tests -v
      - name: Download prices (not committed, see README)
        run: |
          python scripts/download_data.py
          ls data
      - run: python scripts/run_backtest.py
      - name: Commit results (derived statistics only, no raw prices)
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add README.md results/summary.md results/summary.json results/*.png
          git diff --cached --quiet || git commit -m "Update backtest results [skip ci]"
          git push
